# ------------------------------------------------------------------------------
# 1. LAUNCHERS & SYSTEM CONTROL
# ------------------------------------------------------------------------------
# MagikOS Menu (Super + Space)
bindsym $mod+Space exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-menu toggle'

# Keybindings Menu (Super + K)
bindsym $mod+k exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-menu-keybindings'

# Apps Menu (Alt + Space)
bindsym Mod1+Space exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-menu toggle apps'

# Clipboard History (Super + Alt + V)
bindsym $mod+Mod1+v exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-shell shell toggle magikos.clipboard'

# Theme Picker (Alt + Ctrl + Shift + T)
bindsym Mod1+Ctrl+Shift+t exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-menu toggle style.theme'

# System / Power Menu (Super + Escape)
bindsym $mod+Escape exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-menu toggle system'

# Lock Computer (Super + Ctrl + L)
bindsym $mod+Ctrl+l exec swaylock -f -c 000000

# Toggle Menu (Super + Ctrl + O)
bindsym $mod+Ctrl+o exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-menu toggle trigger.toggle'

# --- TOGGLE MODES ---
# Night Light (Super + Ctrl + N)
bindsym $mod+Ctrl+n exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-toggle-nightlight'

# Silence Notifications (Super + Ctrl + ,)
bindsym $mod+Ctrl+comma exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-toggle-notification-silencing'

# Stay Awake (Idle Lock Disabled) (Super + Ctrl + I)
bindsym $mod+Ctrl+i exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-toggle-idle'

# Top Bar (Super + Shift + Space)
bindsym $mod+Shift+space exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-toggle-bar'

# --- HARDWARE MENUS & TOGGLES ---
# Hardware Menu (Super + Ctrl + H)
bindsym $mod+Ctrl+h exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-menu toggle trigger.hardware'

# Touchpad (XF86TouchpadToggle)
bindsym XF86TouchpadToggle exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-toggle-touchpad'

# Dictation (Voxtype) - Hold F9 to dictate / Super + Ctrl + X to toggle
bindsym F9 exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-voxtype-toggle start'
bindsym --release F9 exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-voxtype-toggle stop'
bindsym $mod+Ctrl+x exec bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/etc/magikos}"; export PATH="$MAGIKOS_PATH/bin:$PATH"; exec magikos-voxtype-toggle toggle'

# Terminal Launcher
bindsym $mod+Return exec foot

# Browser Launcher
bindsym $mod+Shift+Return exec brave-origin

# ------------------------------------------------------------------------------
# 2. WINDOW MANAGEMENT
# ------------------------------------------------------------------------------
# Close Active Window (Super + W)
bindsym $mod+w kill

# Close All Windows in Current Workspace (Ctrl + Alt + Delete)
bindsym Ctrl+Mod4+Delete exec swaymsg "[workspace=$(swaymsg -t get_workspaces --type json | jq -r '.[] | select(.focused==true) | .name')] kill"

# Toggle Floating / Tiling (Super + T)
bindsym $mod+t floating toggle

# Toggle Split Orientation Horizontal / Vertical (Super + J)
bindsym $mod+j layout toggle split
bindsym $mod+Shift+v layout toggle split # Manual override (Super + Shift + V)

# Fullscreen Modes
bindsym $mod+f fullscreen toggle
bindsym $mod+Mod1+f fullscreen toggle global # Full width across all monitors

# Sticky Window Toggle (Super + O)
bindsym $mod+o sticky toggle

# Scratchpad Overlay (Super + S / Super + Alt + S)
bindsym $mod+s scratchpad show
bindsym $mod+Mod1+s move scratchpad

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Move Focus Window (Super + Shift + Arrows)
bindsym $mod+Shift+left move left
bindsym $mod+Shift+down move down
bindsym $mod+Shift+up move up
bindsym $mod+Shift+right move right

# Window Resizing (Super + Equal / Minus)
bindsym $mod+equal resize grow width 20 px or 5 ppt
bindsym $mod+minus resize shrink width 20 px or 5 ppt
bindsym $mod+Shift+equal resize grow height 20 px or 5 ppt
bindsym $mod+Shift+minus resize shrink height 20 px or 5 ppt

# Mouse Floating Binds
floating_modifier $mod normal

# ------------------------------------------------------------------------------
# 3. WORKSPACE MANAGEMENT
# ------------------------------------------------------------------------------
# Jump to Workspace (Super + 1..0)
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

# Move window AND follow to workspace
bindsym $mod+Shift+1 move container to workspace number 1; workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2; workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3; workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4; workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5; workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6; workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7; workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8; workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9; workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10; workspace number 10

# Move Window to Workspace WITHOUT Following (Super + Shift + Alt + 1..4)
bindsym $mod+Shift+Mod1+1 move container to workspace number 1
bindsym $mod+Shift+Mod1+2 move container to workspace number 2
bindsym $mod+Shift+Mod1+3 move container to workspace number 3
bindsym $mod+Shift+Mod1+4 move container to workspace number 4

# Workspace Cycling
bindsym $mod+Tab workspace next
bindsym $mod+Shift+Tab workspace prev
bindsym $mod+Ctrl+Tab workspace back_and_forth

# ------------------------------------------------------------------------------
# 4. HARDWARE CONTROLS (VOLUME, BRIGHTNESS & MEDIA)
# `--locked` allows hotkeys to function on the lockscreen.
# ------------------------------------------------------------------------------

# --- VOLUME CONTROLS (WirePlumber / PipeWire) ---
# Standard 5% Volume Steps
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Alt Precision Modifier (1% Volume Steps)
bindsym --locked Mod1+XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindsym --locked Mod1+XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

# --- BRIGHTNESS CONTROLS (brightnessctl) ---
# Standard 5% Steps (-e applies exponential perception curve)
bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+ -e
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%- -e

# Alt Precision Modifier (1% Brightness Steps)
bindsym --locked Mod1+XF86MonBrightnessUp exec brightnessctl set 1%+ -e
bindsym --locked Mod1+XF86MonBrightnessDown exec brightnessctl set 1%- -e

# Shift Modifier (Max / Min Brightness)
bindsym --locked Shift+XF86MonBrightnessUp exec brightnessctl set 100%
bindsym --locked Shift+XF86MonBrightnessDown exec brightnessctl set 1%

# --- MEDIA CONTROLS ---
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous

# ------------------------------------------------------------------------------
# 5. SCREENSHOT CONTROLS
# ------------------------------------------------------------------------------

# Fullscreen screenshot saved to Pictures and copied to clipboard
bindsym Print exec flameshot full -c -p ~/Pictures

# ------------------------------------------------------------------------------
# 6. UNIVERSAL CLIPBOARD
# ------------------------------------------------------------------------------
# Copy current primary selection to clipboard (Super + C)
bindsym $mod+c exec wl-paste -p | wl-copy

# Paste clipboard content into focused window (Super + V)
bindsym $mod+v exec wl-paste --no-newline | wtype -
