# ==============================================================================
# MagikOS Environment
# ==============================================================================

# Config-variable fallbacks for exec lines in this directory. They mirror the
# packaged tree location; plain sway sessions (ly -> sway.desktop) bypass uwsm,
# so session code cannot assume MAGIKOS_PATH is present in the environment.
# Dev checkouts override this file in ~/.config/sway/environment.conf.
set $MAGIKOS_PATH /etc/magikos
set $PATH /etc/magikos/bin:$HOME/.local/bin:$PATH
