# ==============================================================================
# MagikOS Autostart
# ==============================================================================

# Adaptive tiling: auto side-by-side / stacked based on window size
# Disabled: nothing in this repo creates ~/.venvs/autotiling, so the exec
# failed silently on every login. Create the venv and uncomment to enable:
#   python3 -m venv ~/.venvs/autotiling && ~/.venvs/autotiling/bin/pip install autotiling
# exec ~/.venvs/autotiling/bin/autotiling

# --- Bar: QuickShell ---
# QuickShell is the only bar; it launches below. Its log is kept in
# ~/.local/state/magikos/quickshell.log so a bar that fails to come up can
# always be diagnosed after the fact.
exec_always bash -c 'export MAGIKOS_PATH=/etc/magikos; export PATH="$MAGIKOS_PATH/bin:$HOME/.local/bin:$PATH"; mkdir -p "$HOME/.local/state/magikos"; { systemctl --user import-environment MAGIKOS_PATH PATH 2>/dev/null; systemctl --user restart wayland-wm-app-daemon.service 2>/dev/null; exec quickshell -n -p "$MAGIKOS_PATH/shell"; } >>"$HOME/.local/state/magikos/quickshell.log" 2>&1'

exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
