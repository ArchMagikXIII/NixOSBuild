# ==============================================================================
# MagikOS Window Appearance
# ==============================================================================

# Wallpaper
# A wallpaper that cannot be read is a fatal config error, not a warning: sway
# aborts the remaining includes. The installer seeds wallpapers/ into
# ~/Pictures/Wallpapers, so this resolves on a provisioned account. If you
# delete or move the image, swap in the solid_color line below rather than
# leaving the path dangling.
output * bg ~/Pictures/Wallpapers/Osaka.jpg fill
# output * bg #1e1e2e solid_color

# Remove old i3-style title bars
default_border pixel 2
default_floating_border pixel 2

# Cleaner tiling behavior
smart_borders on
