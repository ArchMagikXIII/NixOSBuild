# ==============================================================================
# Window Rules
# Magikos launches
# TUIs, wizards, and dialogs under dedicated app-ids (org.magikos.terminal,
# TUI.float, ...) that read as floating windows.
# ==============================================================================

# Floating windows.
for_window [app_id="^(org\.magikos\.(btop|terminal|bash)|TUI\.float)$"] floating enable
for_window [app_id="^(org\.codeberg\.dnkl\.foot|org\.gnome\.NautilusPreviewer|org\.gnome\.Evince|imv|mpv)$"] floating enable
for_window [class="Magikos"] floating enable

# The portal only ever shows dialogs — file pickers, screen shares, permission
# prompts — so every one of its windows belongs in the floating treatment,
# whatever the app that asked for it titled it.
for_window [app_id="^xdg-desktop-portal-gtk$"] floating enable

# Standard wizard geometry: floating terminal with presentation gets 875x600,
# centered; About gets its fastfetch-sized window.
for_window [app_id="org.magikos.terminal"] resize set 875 600, move position center
for_window [app_id="TUI.float"] resize set 875 600, move position center
for_window [app_id="org.magikos.about"] resize set 920 480, move position center

# Fullscreen screensaver.
for_window [app_id="org.magikos.screensaver"] fullscreen enable
